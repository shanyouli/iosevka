name: 🔄 Auto Update Flake Inputs

on:
  schedule:
    # 每两个月一次（1/3/5/7/9/11 月的 1 日 02:30 UTC）
    - cron: "30 2 1 */2 *"
  workflow_dispatch:

jobs:
  update-flake:
    name: 🛠️ Update & Test Flake
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ❄️ Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes

      - name: ♻️ 启用 Nix 缓存
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: 🤖 Prepare GitHub Bot
        run: |
          git config --local user.email "flakebot@users.noreply.github.com"
          git config --local user.name "flakebot"

      - name: 🔄 Update Flake Inputs
        id: update
        run: |
          old_hash=$(sha256sum flake.lock)
          nix develop --command just update-flake --commit-lock-file
          new_hash=$(sha256sum flake.lock)

          if [ "$old_hash" != "$new_hash" ]; then
            echo "CHANGED=true" >> $GITHUB_ENV
            echo "✨ Flake inputs updated."
          else
            echo "CHANGED=false" >> $GITHUB_ENV
            echo "😴 No updates found."
          fi

      - name: 🧪 校验 devShell
        if: env.CHANGED == 'true'
        run: |
          # Nix 只提供工具链，不获取源码 / 补丁器
          nix develop --command bash -euo pipefail -c '
            just --version
            just --list > /dev/null
            node --version
            ttfautohint --version
            python -c "import fontTools; print(\"fonttools\", fontTools.version)"
            python -c "import fontforge; print(\"fontforge ok\")"
            command -v gftools
            command -v zip
          '

      - name: ⬆️ Push Changes
        if: env.CHANGED == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: ✅ Done
        if: env.CHANGED == 'false'
        run: echo "No changes to push. Workflow finished."
